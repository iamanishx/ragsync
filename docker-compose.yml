services:
  discord-bot:
    build: .
    container_name: discord-bot-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORTAL_PORT:-8787}:8787"
    depends_on:
      - redis
      - qdrant
    networks:
      - bot-network
    volumes:
      - ./logs:/app/logs
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - RAILWAY_ENVIRONMENT=${RAILWAY_ENVIRONMENT:-development}

  redis:
    image: redis:7-alpine
    container_name: discord-bot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: discord-bot-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  bot-network:
    driver: bridge
